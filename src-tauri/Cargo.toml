[package]
name = "claude-perfiles"
version = "2.1.0"
description = "Claude Perfiles"
edition = "2021"
publish = false

[lib]
name = "claude_perfiles_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = { version = "0.33", default-features = false, features = ["system"] }
dirs = "6"

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
mslnk = "0.1"
# ShellExecuteW: abre los alias de apps de la Store (wt.exe) donde CreateProcess falla con el error 1920
windows-sys = { version = "0.61", features = ["Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
