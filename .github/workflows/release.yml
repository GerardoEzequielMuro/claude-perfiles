name: Release

# Al empujar un tag vX.Y.Z se compilan los instaladores de Windows y Mac
# y se publican en GitHub Releases.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  create-release:
    # Un solo borrador para los dos builds: los borradores no se encuentran por tag, así que si
    # cada build lo creara por su cuenta quedarían dos.
    runs-on: ubuntu-latest
    outputs:
      id: ${{ steps.r.outputs.id }}
    steps:
      - uses: actions/checkout@v4
      - id: r
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          ID=$(gh api -X POST "repos/${{ github.repository }}/releases" -f tag_name="$TAG" -f name="Claude Perfiles $TAG" -F draft=true -F body=@.github/release-notes.md --jq .id)
          test -n "$ID"
          echo "id=$ID" >> "$GITHUB_OUTPUT"

  build:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: "--bundles nsis"
          - platform: macos-latest
            args: "--target universal-apple-darwin --bundles dmg"
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: npm ci

      - name: Tests
        working-directory: src-tauri
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then CP_TEST_MANIFEST=1 cargo test --lib; else cargo test --lib; fi

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          releaseId: ${{ needs.create-release.outputs.id }}
          args: ${{ matrix.args }}

  stable-names:
    # Copias con nombre fijo para que la página de descarga tenga links permanentes.
    needs: [create-release, build]
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          mkdir out && cd out
          gh release download "$TAG" -R "$REPO" -p "*-setup.exe" -p "*.dmg"
          for f in *-setup.exe; do cp "$f" ../ClaudePerfiles-Windows.exe; done
          for f in *.dmg; do cp "$f" ../ClaudePerfiles-Mac.dmg; done
          cd ..
          gh release upload "$TAG" -R "$REPO" --clobber ClaudePerfiles-Windows.exe ClaudePerfiles-Mac.dmg
